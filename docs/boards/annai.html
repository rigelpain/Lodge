<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>コース案内（案内図）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
<style>
  /* 案内図: 発売までをゲレンデの丘とリフトで描き、下は案内板のように項目を並べる。主役の色は「いまの位置」の赤一つ */
  :root { --sky: #e6edf1; --snow: #ffffff; --ink: #1d2b33; --ink-2: #5d6b73; --line: #d5dde2; --board: #1f3b34; --red: #c8412f; --tree: #2f5a48; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--snow); color: var(--ink); font-family: "BIZ UDPGothic", sans-serif; font-size: 15px; line-height: 1.75; }
  h1, h2, h3, p, ol, ul, dl, dd { margin: 0; }
  ol, ul { padding: 0; list-style: none; }

  .map { background: var(--sky); position: relative; }
  .map svg { display: block; width: 100%; height: auto; }
  .map .name { position: absolute; left: 32px; top: 24px; }
  .map h1 { font-size: 28px; letter-spacing: 0.08em; }
  .map .name p { font-size: 13px; color: var(--ink-2); }

  .board { background: var(--board); color: #fff; }
  .board .in { max-width: 1240px; margin: 0 auto; padding: 18px 32px; display: flex; gap: 32px; align-items: baseline; flex-wrap: wrap; }
  .board .k { font-size: 13px; color: #b9cbc4; letter-spacing: 0.12em; }
  .board .v { font-size: 26px; font-weight: 700; }
  .board .t { color: #b9cbc4; }
  .board .t b { color: #fff; font-size: 20px; }

  .cols { max-width: 1240px; margin: 0 auto; padding: 24px 32px 8px; display: grid; grid-template-columns: 1.2fr 1.2fr 1fr; gap: 0; }
  .cols > section { padding: 0 24px; border-left: 1px solid var(--line); }
  .cols > section:first-child { padding-left: 0; border-left: 0; }
  h2 { font-size: 13px; color: var(--ink-2); letter-spacing: 0.12em; padding-bottom: 6px; border-bottom: 2px solid var(--ink); margin-bottom: 4px; }
  .rows li { display: grid; grid-template-columns: 4em 1fr; padding: 7px 0; border-bottom: 1px solid var(--line); }
  .rows .s { font-size: 13px; color: var(--ink-2); }
  .rows li.now { font-weight: 700; }
  .rows li.now .s { color: var(--red); }
  .rows li.done { color: var(--ink-2); }
  .plain li { padding: 7px 0; border-bottom: 1px solid var(--line); }

  .small { max-width: 1240px; margin: 0 auto; padding: 16px 32px 40px; display: grid; grid-template-columns: 1.2fr 1fr 1.2fr; gap: 32px; font-size: 14px; }
  .small dt { font-weight: 700; margin-top: 6px; }
  .small dd { color: var(--ink-2); }
  table { width: 100%; border-collapse: collapse; }
  td { padding: 6px 0; border-bottom: 1px solid var(--line); }
  td + td { text-align: right; font-feature-settings: "tnum"; }
  .refs li { padding: 6px 0; border-bottom: 1px solid var(--line); }
  .refs span { color: var(--ink-2); }

  @media (max-width: 900px) {
    .map .name { position: static; padding: 16px 16px 0; }
    .board .in, .cols, .small { padding-left: 16px; padding-right: 16px; }
    .cols, .small { grid-template-columns: 1fr; gap: 24px; }
    .cols > section { padding: 0; border-left: 0; }
  }
</style>
</head>
<body>
<header class="map">
  <div class="name"><h1>ソリのゲーム　コース案内</h1><p id="goal"></p></div>
  <svg id="hill" viewBox="0 0 1200 380" role="img" aria-labelledby="hill-t"><title id="hill-t">発売までの道のり</title></svg>
</header>
<div class="board" role="status">
  <div class="in">
    <span class="k">次の節目</span>
    <span class="v" id="next"></span>
    <span class="t" id="due"></span>
  </div>
</div>
<main class="cols">
  <section><h2>いまの作業</h2><ul class="rows" id="work"></ul></section>
  <section><h2>決めたこと</h2><ul class="rows" id="dec"></ul></section>
  <section><h2>まだ決めていない</h2><ul class="plain" id="q"></ul></section>
</main>
<footer class="small">
  <section><h2>場所</h2><dl id="places"></dl></section>
  <section><h2>お金</h2><table><tbody id="costs"></tbody></table></section>
  <section><h2>参考にするゲーム</h2><ul class="refs" id="refs"></ul></section>
</footer>
<script src="common.js"></script>
<script>
load(d => {
  $('goal').textContent = d.goal + '　' + fmt(d.updated) + ' 更新';
  $('next').textContent = d.next.label;
  $('due').innerHTML = `${fmt(d.next.due)}まで あと <b>${daysLeft(d.next.due)}</b> 日`;
  const order = { now: 0, todo: 1, done: 2 };
  $('work').innerHTML = [...d.tasks].sort((a, b) => order[a.state] - order[b.state]).map(t => `<li class="${t.state}"><span class="s">${STATE[t.state]}</span>${esc(t.text)}</li>`).join('');
  $('dec').innerHTML = [...d.decisions].reverse().map(x => `<li><span class="s">${short(x.date)}</span>${esc(x.text)}</li>`).join('');
  $('q').innerHTML = d.questions.map(q => `<li>${esc(q)}</li>`).join('');
  $('places').innerHTML = d.places.map(p => `<dt>${esc(p.name)}</dt><dd>${esc(p.note)}</dd>`).join('');
  $('costs').innerHTML = d.costs.map(c => `<tr><td>${esc(c.item)}</td><td>${esc(c.yen)}</td></tr>`).join('');
  $('refs').innerHTML = d.refs.map(r => `<li>${esc(r.name)}　<span>${esc(r.note)}</span></li>`).join('');

  // 丘とリフト。ふもと（左）から頂上（右）へ段を駅として置く
  const W = 1200, BASE = 360, H = 250, CX = 960, S = 300;
  const y = (x) => BASE - H * Math.exp(-((x - CX) ** 2) / (2 * S * S));
  let ground = `M0 ${BASE}`;
  for (let x = 0; x <= W; x += 10) ground += ` L${x} ${y(x).toFixed(1)}`;
  ground += ` L${W} 380 L0 380Z`;
  const n = d.phases.length, x0 = 150, x1 = CX;
  const sx = d.phases.map((_, i) => x0 + (x1 - x0) * i / (n - 1));
  const trees = [];
  for (let i = 0; i < 40; i++) {
    const x = 20 + ((i * 397) % 1160), h = 16 + (i * 7) % 14, gy = y(x) + 34 + (i * 13) % 36;
    // 駅の名前の下に木を置かない
    if (gy > 378 || sx.some(s => Math.abs(s - x) < 70)) continue;
    trees.push(`<path d="M${x} ${gy - h}L${x - h * 0.35} ${gy}L${x + h * 0.35} ${gy}Z" fill="var(--tree)" opacity="${0.45 + (i % 3) * 0.15}"/>`);
  }
  const pts = d.phases.map((p, i) => { const x = x0 + (x1 - x0) * i / (n - 1); return { p, x, y: y(x) - 46 }; });
  const ni = d.phases.findIndex(p => p.state === 'now');
  const seg = (a, b, dash) => `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="var(--ink)" stroke-width="${dash ? 1.5 : 3}" ${dash ? 'stroke-dasharray="6 6"' : ''}/>`;
  let lift = '';
  for (let i = 0; i < n - 1; i++) lift += seg(pts[i], pts[i + 1], i >= ni);
  const stations = pts.map((s, i) => {
    const now = s.p.state === 'now', done = s.p.state === 'done';
    const up = i % 2 === 0;
    const ty = up ? s.y - 22 : s.y + 34;
    return `<g>
      <line x1="${s.x}" y1="${s.y}" x2="${s.x}" y2="${y(s.x)}" stroke="var(--ink)" stroke-width="2"/>
      <circle cx="${s.x}" cy="${s.y}" r="${now ? 9 : 6}" fill="${now ? 'var(--red)' : done ? 'var(--ink)' : '#fff'}" stroke="var(--ink)" stroke-width="2"/>
      <text x="${s.x}" y="${ty}" text-anchor="middle" font-size="15" font-weight="${now ? 700 : 400}" fill="${now ? 'var(--red)' : done ? 'var(--ink-2)' : 'var(--ink)'}">${esc(s.p.name)}</text>
      <text x="${s.x}" y="${ty + 18}" text-anchor="middle" font-size="12" fill="var(--ink-2)">${now ? 'いまここ　' : ''}${esc(s.p.note)}</text>
    </g>`;
  }).join('');
  $('hill').insertAdjacentHTML('beforeend', `<path d="${ground}" fill="var(--snow)"/>${trees.join('')}${lift}${stations}`);
});
</script>
</body>
</html>
