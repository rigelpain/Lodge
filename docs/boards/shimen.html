<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>開発だより（紙面）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* 紙面: 見出しの大小と段組と罫で読ませる。色は墨と、いま動いているものに朱を一つ */
  :root { --paper: #f7f4ee; --ink: #22201d; --ink-2: #6b665e; --rule: #22201d; --hair: #cfc8bb; --accent: #b23a2a; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: "Noto Sans JP", sans-serif; font-size: 15px; line-height: 1.85; }
  h1, h2, h3, p, ol, ul, dl, dd, figure { margin: 0; }
  ol, ul { padding: 0; list-style: none; }
  .sheet { max-width: 1240px; margin: 0 auto; padding: 24px 32px 48px; }

  .mast { display: grid; grid-template-columns: 1fr auto 1fr; align-items: end; border-bottom: 3px double var(--rule); padding-bottom: 8px; }
  .mast .title { font-family: "Noto Serif JP", serif; font-weight: 700; font-size: 40px; line-height: 1.1; letter-spacing: 0.12em; text-align: center; }
  .mast .meta { font-size: 12px; color: var(--ink-2); line-height: 1.6; }
  .mast .meta.r { text-align: right; }

  .route { display: flex; border-bottom: 1px solid var(--rule); font-size: 13px; }
  .route li { flex: 1; padding: 6px 10px; border-left: 1px solid var(--hair); color: var(--ink-2); }
  .route li:first-child { border-left: 0; padding-left: 0; }
  .route li.done { color: var(--ink-2); text-decoration: line-through; text-decoration-color: var(--hair); }
  .route li.now { color: var(--ink); font-weight: 700; box-shadow: inset 0 -3px 0 var(--accent); }

  .front { display: grid; grid-template-columns: 2.1fr 1fr; gap: 0; border-bottom: 1px solid var(--rule); }
  .lead { padding: 24px 32px 28px 0; border-right: 1px solid var(--rule); }
  .lead .kicker { font-size: 13px; color: var(--accent); font-weight: 700; letter-spacing: 0.08em; }
  .lead h2 { font-family: "Noto Serif JP", serif; font-weight: 700; font-size: 44px; line-height: 1.3; margin-top: 6px; letter-spacing: 0.02em; }
  .lead .due { font-size: 14px; color: var(--ink-2); margin-top: 8px; }
  .lead .body { columns: 2; column-gap: 32px; column-rule: 1px solid var(--hair); margin-top: 20px; text-align: justify; }
  .lead .body p + p { margin-top: 0.9em; }
  .lead .body p:first-child::first-letter { font-family: "Noto Serif JP", serif; font-size: 2.1em; float: left; line-height: 1; margin: 4px 6px 0 0; font-weight: 700; }

  .side { padding: 24px 0 28px 24px; }
  h3 { font-family: "Noto Serif JP", serif; font-size: 18px; font-weight: 700; padding-bottom: 4px; border-bottom: 1px solid var(--rule); margin-bottom: 10px; }
  .work li { padding: 6px 0; border-bottom: 1px dotted var(--hair); display: grid; grid-template-columns: 3.5em 1fr; }
  .work li span { font-size: 12px; color: var(--ink-2); }
  .work li.now { font-weight: 700; }
  .work li.now span { color: var(--accent); }
  .work li.done { color: var(--ink-2); }

  .lower { display: grid; grid-template-columns: 1.3fr 1fr 1fr 1fr; border-bottom: 1px solid var(--rule); }
  .lower > section { padding: 20px 24px 24px; border-left: 1px solid var(--hair); }
  .lower > section:first-child { padding-left: 0; border-left: 0; }
  .diary li { padding: 6px 0; border-bottom: 1px dotted var(--hair); }
  .diary time { font-size: 12px; color: var(--ink-2); margin-right: 8px; font-feature-settings: "tnum"; }
  .open li { padding: 6px 0; border-bottom: 1px dotted var(--hair); }
  .places dt { font-weight: 700; margin-top: 8px; }
  .places dt:first-child { margin-top: 0; }
  .places dd { color: var(--ink-2); font-size: 14px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  td { padding: 6px 0; border-bottom: 1px dotted var(--hair); vertical-align: top; }
  td + td { text-align: right; font-feature-settings: "tnum"; white-space: nowrap; padding-left: 12px; }

  .foot { display: grid; grid-template-columns: 2fr 1fr; gap: 32px; padding-top: 16px; font-size: 13px; color: var(--ink-2); }
  .foot .refs { columns: 2; column-gap: 24px; }
  .foot .refs li { break-inside: avoid; margin-bottom: 6px; }
  .foot .refs b { color: var(--ink); font-weight: 500; }
  .foot blockquote { margin: 0; font-family: "Noto Serif JP", serif; font-size: 15px; color: var(--ink); line-height: 1.9; }

  @media (max-width: 900px) {
    .sheet { padding: 16px; }
    .mast { grid-template-columns: 1fr; text-align: center; }
    .mast .meta, .mast .meta.r { text-align: center; }
    .route { flex-wrap: wrap; }
    .route li { flex: 1 1 33%; border-left: 0; padding-left: 0; }
    .front, .lower, .foot { grid-template-columns: 1fr; }
    .lead { padding-right: 0; border-right: 0; border-bottom: 1px solid var(--rule); }
    .lead h2 { font-size: 32px; }
    .lead .body, .foot .refs { columns: 1; }
    .side, .lower > section { padding-left: 0; border-left: 0; }
  }
</style>
</head>
<body>
<div class="sheet">
  <header class="mast">
    <p class="meta" id="date"></p>
    <h1 class="title">ソリのゲーム開発だより</h1>
    <p class="meta r" id="goal"></p>
  </header>
  <nav aria-label="発売までの道のり"><ol class="route" id="route"></ol></nav>

  <main>
    <div class="front">
      <article class="lead">
        <p class="kicker">次の節目</p>
        <h2 id="next"></h2>
        <p class="due" id="due"></p>
        <div class="body"><p id="pitch"></p><p id="origin"></p></div>
      </article>
      <section class="side">
        <h3>いまの作業</h3>
        <ul class="work" id="work"></ul>
      </section>
    </div>

    <div class="lower">
      <section><h3>決めたこと</h3><ol class="diary" id="diary"></ol></section>
      <section><h3>まだ決めていない</h3><ul class="open" id="open"></ul></section>
      <section><h3>場所</h3><dl class="places" id="places"></dl></section>
      <section><h3>かかるお金</h3><table><tbody id="costs"></tbody></table></section>
    </div>
  </main>

  <footer class="foot">
    <section><h3>参考にするゲーム</h3><ul class="refs" id="refs"></ul></section>
    <section><h3>はじまり</h3><blockquote id="origin2"></blockquote></section>
  </footer>
</div>
<script src="common.js"></script>
<script>
load(d => {
  $('date').textContent = fmt(d.updated) + ' 更新';
  $('goal').textContent = d.goal;
  $('route').innerHTML = d.phases.map(p => `<li class="${p.state}"${p.state === 'now' ? ' aria-current="step"' : ''}>${esc(p.name)}</li>`).join('');
  $('next').textContent = d.next.label;
  $('due').textContent = `${fmt(d.next.due)}まで、あと${daysLeft(d.next.due)}日`;
  $('pitch').textContent = d.pitch;
  const now = d.phases.find(p => p.state === 'now');
  $('origin').textContent = now ? `いまは「${now.name}」の段で、${now.note}を確かめている。` : '';
  const order = { now: 0, todo: 1, done: 2 };
  $('work').innerHTML = [...d.tasks].sort((a, b) => order[a.state] - order[b.state]).map(t => `<li class="${t.state}"><span>${STATE[t.state]}</span>${esc(t.text)}</li>`).join('');
  $('diary').innerHTML = [...d.decisions].reverse().map(x => `<li><time datetime="${x.date}">${short(x.date)}</time>${esc(x.text)}</li>`).join('');
  $('open').innerHTML = d.questions.map(q => `<li>${esc(q)}</li>`).join('');
  $('places').innerHTML = d.places.map(p => `<dt>${esc(p.name)}</dt><dd>${esc(p.note)}</dd>`).join('');
  $('costs').innerHTML = d.costs.map(c => `<tr><td>${esc(c.item)}</td><td>${esc(c.yen)}</td></tr>`).join('');
  $('refs').innerHTML = d.refs.map(r => `<li><b>${esc(r.name)}</b>　${esc(r.note)}</li>`).join('');
  $('origin2').textContent = d.origin;
});
</script>
</body>
</html>
