<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ソリのゲーム 開発ダッシュボード</title>
<meta name="description" content="みんなでソリを押して丘を登り、一緒に滑り降りるゲームの開発の進み具合。Steam での販売を目指しています。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;500;700&family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="dash.css">
</head>
<body>
<a class="skip" href="#main">本文へ移る</a>

<header class="head">
  <p class="eyebrow">ソリのゲーム（仮題）　開発ダッシュボード　<time id="updated"></time></p>
  <h1 id="goal"></h1>
</header>

<main id="main">
  <!-- 1. 道のり: 6段を1本の帯に -->
  <section class="block route" aria-labelledby="route-h">
    <h2 id="route-h">発売までの道のり</h2>
    <ol class="track" id="track"></ol>
  </section>

  <!-- 2. 次の節目: 残りの日を1日1マスで -->
  <section class="block next" aria-labelledby="next-h">
    <h2 id="next-h">次の節目</h2>
    <div class="next-body">
      <p class="next-what" id="next"></p>
      <p class="next-num"><span id="days"></span><small>日</small></p>
    </div>
    <ol class="days" id="dayline" aria-hidden="true"></ol>
    <p class="cap" id="daycap"></p>
  </section>

  <!-- 3. 計測: 押す人数と登る時間 -->
  <section class="block climb" aria-labelledby="climb-h">
    <h2 id="climb-h"></h2>
    <div class="bars" id="bars"></div>
    <p class="cap" id="climbcap"></p>
  </section>

  <!-- 4. 作業: 1件1点 -->
  <section class="block tasks" aria-labelledby="tasks-h">
    <h2 id="tasks-h">作業</h2>
    <p class="dots" id="dots" aria-hidden="true"></p>
    <ol class="list" id="tasks"></ol>
  </section>

  <!-- 5. 決めたこと: 日付の軸 -->
  <section class="block decisions" aria-labelledby="dec-h">
    <h2 id="dec-h">決めたこと</h2>
    <div class="axis" id="axis" aria-hidden="true"></div>
    <ol class="list dated" id="decisions"></ol>
  </section>

  <!-- 6. まだ決めていないこと -->
  <section class="block open" aria-labelledby="open-h">
    <h2 id="open-h">まだ決めていない</h2>
    <ol class="list numbered" id="questions"></ol>
  </section>

  <!-- 7. 小さな表 -->
  <section class="block facts" aria-label="場所・お金・参考">
    <div><h2>場所</h2><dl id="places"></dl></div>
    <div><h2>お金</h2><dl id="costs"></dl></div>
    <div><h2>参考にするゲーム</h2><dl id="refs"></dl></div>
  </section>
</main>

<footer class="foot">
  <p id="origin"></p>
  <p><a href="https://github.com/rigelpain/sled-game">GitHub</a>　中身は docs/data.json</p>
</footer>

<script src="boards/common.js"></script>
<script src="dash.js"></script>
</body>
</html>
