<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ソリのゲーム 開発ダッシュボード</title>
<meta name="description" content="みんなでソリを押して丘を登り、一緒に滑り降りるゲームの開発の現在地。発売までの段階ごとに、決めたこと・作業・まだ決めていないことを一枚で。">
<meta name="color-scheme" content="light">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="index.css">
</head>
<body>
<a class="skip" href="#main">本文へ移る</a>

<header class="top">
  <p class="kicker"><span id="title"></span><span class="sep" aria-hidden="true"></span><time id="updated"></time> 更新</p>
  <h1 id="goal"></h1>
  <p class="pitch" id="pitch"></p>
</header>

<main id="main">
  <section class="next" aria-labelledby="next-h">
    <h2 id="next-h">次の節目</h2>
    <p class="next-what" id="next-label"></p>
    <p class="next-when"><time id="next-due"></time><span id="next-left"></span></p>
  </section>

  <!-- 段階 × 状態の行列。横: 発売までの段階、縦: 決めた・作業・まだ -->
  <section class="matrix" aria-labelledby="road-h" id="matrix">
    <h2 id="road-h" class="rail rail-head">発売までの段階</h2>
    <p class="rail rail-decided" id="rail-decided" aria-hidden="true">決めた</p>
    <p class="rail rail-tasks" id="rail-tasks" aria-hidden="true">作業</p>
    <p class="rail rail-open" id="rail-open" aria-hidden="true">まだ</p>
    <ol class="phases" id="phases"></ol>
  </section>

  <section class="facts" aria-label="計測・場所・お金・参考">
    <table class="fact" id="climb"></table>
    <table class="fact" id="places"></table>
    <table class="fact" id="costs"></table>
    <table class="fact" id="refs"></table>
  </section>
</main>

<footer class="foot">
  <p id="origin"></p>
  <p><a href="https://github.com/rigelpain/sled-game">GitHub rigelpain/sled-game</a></p>
</footer>

<script src="index.js"></script>
</body>
</html>
